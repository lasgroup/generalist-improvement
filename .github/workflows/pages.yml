name: Deploy research website

on:
  push:
    branches: [gh-pages]
    paths:
      - "gh-pages/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/prepare-pages.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The website is ready to serve; no repository build is needed.
      - name: Check out static website
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /gh-pages/
            /.github/scripts/prepare-pages.py
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website assets
        run: python3 .github/scripts/prepare-pages.py gh-pages "$RUNNER_TEMP/pages-site"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
